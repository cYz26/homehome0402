<text x="1060" y="250" font-size="27" fill="#36513f" font-weight="600">01  西墙书柜</text>
<text x="1060" y="289" font-size="21" fill="#677565" >沿墙约 3.00 m，高度暂定 2.50 m</text>
<text x="1060" y="320" font-size="21" fill="#677565" >上柜深 35 cm / 底柜深 80 cm</text>
<text x="1060" y="351" font-size="21" fill="#677565" >露出坐面约 45 cm，坐面高约 45 cm</text>
<text x="1060" y="382" font-size="21" fill="#677565" >南段加薄坐垫；底柜需承重设计</text>
<text x="1060" y="455" font-size="27" fill="#36513f" font-weight="600">02  东墙工作区</text>
<text x="1060" y="494" font-size="21" fill="#677565" >桌面 1.40 × 0.70 m，朝东使用</text>
<text x="1060" y="525" font-size="21" fill="#677565" >桌子靠北段，北端留 30 cm</text>
<text x="1060" y="556" font-size="21" fill="#677565" >桌旁间隔 15 cm，独立升降</text>
<text x="1060" y="587" font-size="21" fill="#677565" >窗前不增设柜子</text>
<text x="1060" y="660" font-size="27" fill="#36513f" font-weight="600">03  入口侧配柜</text>
<text x="1060" y="699" font-size="21" fill="#677565" >暂定 1.00 × 0.40 × 1.10 m</text>
<text x="1060" y="730" font-size="21" fill="#677565" >放桌子南侧，材质呼应西侧书柜</text>
<text x="1060" y="761" font-size="21" fill="#677565" >距入口界线留 45 cm</text>
<text x="1060" y="792" font-size="21" fill="#677565" >门轨和门扇叠放位置保留</text>
<text x="1060" y="865" font-size="27" fill="#36513f" font-weight="600">04  转椅与抽屉</text>
<text x="1060" y="904" font-size="21" fill="#677565" >底盘 73.5 cm / 整椅深 76.5 cm</text>
<text x="1060" y="935" font-size="21" fill="#677565" >图示坐姿椅背后约 28 cm</text>
<text x="1060" y="966" font-size="21" fill="#677565" >全开抽屉与椅位冲突约 7 cm</text>
