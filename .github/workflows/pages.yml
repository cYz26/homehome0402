name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:model
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        timeout-minutes: 22
      - run: node scripts/collect-browser-evidence.mjs --output .asset-work/browser-evidence
      - name: Preserve version-bound browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home402-browser-evidence
          path: |
            test-results/
            model/release-checks.json
            public/release.json
            .asset-work/browser-evidence/
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check image privacy metadata
        run: node scripts/check-image-privacy.mjs
      - name: Check model
        run: npm run check:model
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
