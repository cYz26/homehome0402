name: Validate and deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home402-workers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check image privacy metadata
        run: node scripts/check-image-privacy.mjs
      - run: npm run check:model
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: npm run check:worker
      - run: npm run worker:dry-run
      - name: Record complete browser test inventory
        run: npm run test:browser -- --list --reporter=json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-inventory.json
      - name: Share the checked build and test inventory
        id: build-artifact
        uses: actions/upload-artifact@v6
        with:
          name: home402-build
          path: |
            dist/
            model/release-checks.json
            test-results/browser-inventory.json
          if-no-files-found: error

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Serve the checked assets to the section fixture
        # The fixture uses Vite's dev server; its assets come from the same dist.
        run: mkdir -p .asset-work && ln -s ../dist .asset-work/site-public
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser shard ${{ matrix.shard }} of 2
        run: npm run test:browser -- --shard=${{ matrix.shard }}/2 --reporter=list,blob
        timeout-minutes: 22
      - name: Preserve mergeable report, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home402-browser-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
      - name: Preserve raw failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: home402-browser-failure-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  verify:
    needs: [build, browser]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: home402-browser-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge browser results
        run: npx playwright merge-reports --reporter=json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/browser-report.json
      - name: Require every inventoried test and collect evidence
        run: node scripts/collect-browser-evidence.mjs --inventory test-results/browser-inventory.json --output .asset-work/browser-evidence
        env:
          HOME402_BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
      - name: Preserve version-bound browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home402-browser-evidence
          include-hidden-files: true
          path: |
            test-results/
            model/release-checks.json
            public/release.json
            .asset-work/browser-evidence/

  deploy:
    needs: [build, browser, verify]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: ${{ vars.HOME402_WORKER_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_PASSWORD_SHA256: ${{ secrets.SITE_PASSWORD_SHA256 }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HOME402_WORKER_URL: ${{ vars.HOME402_WORKER_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Require deployment credentials
        run: |
          node --input-type=module -e '
          for (const name of ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID", "SITE_PASSWORD_SHA256", "SESSION_SECRET", "HOME402_WORKER_URL"])
            if (!process.env[name]) throw Error(`Missing deployment setting: ${name}`);'
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
      - name: Deploy the checked build with password protection
        run: node scripts/deploy-worker.mjs
      - name: Verify deployed hashes, private assets and model ranges
        run: node scripts/check-deployment.mjs --output test-results/deployment-verification.json
      - name: Preserve deployment readback
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: home402-deployment-evidence
          path: test-results/deployment-verification.json
          if-no-files-found: ignore
